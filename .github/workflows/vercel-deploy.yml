name: Vercel Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA / branch / tag to deploy
        required: true
        default: main

concurrency:
  group: vercel-main
  cancel-in-progress: true

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Resolve ref
        id: resolve
        run: |
          REF="${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}"
          if echo "$REF" | grep -Eq '^[0-9a-f]{7,40}$'; then
            SHA=$(curl -fsSL "https://api.github.com/repos/${{ github.repository }}/commits/${REF}" | python3 -c 'import sys,json; print(json.load(sys.stdin)["sha"])')
            echo "ref=${SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.ref }}
          fetch-depth: 0

      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "Missing secret: VERCEL_TOKEN" >&2
            exit 1
          fi
          if [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "Missing secret: VERCEL_PROJECT_ID" >&2
            exit 1
          fi
          if echo "${VERCEL_ORG_ID}" | grep -q '^team_'; then
            echo "VERCEL_ORG_ID must be your team SLUG (URL segment), not team id (team_...)." >&2
            echo "Example: if URL is https://vercel.com/<teamSlug>/bbyaccounting then set VERCEL_ORG_ID=<teamSlug>." >&2
            exit 1
          fi

      - name: Verify Vercel project access
        id: vercel
        run: |
          set -euo pipefail
          URL="https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}"
          STATUS=$(curl -sS -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" -o .vercel_project.json -w "%{http_code}" "$URL" || true)
          echo "Vercel API status: $STATUS"
          head -c 400 .vercel_project.json || true
          echo
          if [ "$STATUS" != "200" ]; then
            echo "Vercel API request failed for projectId=${VERCEL_PROJECT_ID}" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os

          with open('.vercel_project.json','r',encoding='utf-8') as f:
            d = json.load(f)

          account_id = d.get('accountId') or d.get('orgId')
          project_id = d.get('id')
          name = d.get('name')
          if not account_id or not project_id:
            raise SystemExit('Could not read accountId/id from Vercel API response')

          print(f"project: {name} accountId: {account_id} id: {project_id}")
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
            out.write(f"org_id={account_id}\n")
            out.write(f"project_id={project_id}\n")
          PY

      - name: Export Vercel IDs
        run: |
          echo "VERCEL_ORG_ID=${{ steps.vercel.outputs.org_id }}" >> "$GITHUB_ENV"
          echo "VERCEL_PROJECT_ID=${{ steps.vercel.outputs.project_id }}" >> "$GITHUB_ENV"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link Vercel project
        run: |
          rm -rf .vercel
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}' "${{ steps.vercel.outputs.org_id }}" "${{ steps.vercel.outputs.project_id }}" > .vercel/project.json
          cat .vercel/project.json

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
